<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Simple Website</title>
  <style>
    :root { --pad: 20px; }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #333;
      padding: var(--pad);
    }
    main {
      background: white;
      padding: clamp(20px, 4vw, 48px);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      max-width: 800px;
      width: 100%;
      text-align: center;
    }
    h1 { margin: 0 0 .4em; font-size: clamp(28px, 4vw, 40px); }
    p  { margin: 0 auto 1.25em; font-size: clamp(16px, 2vw, 18px); max-width: 60ch; }
    img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      margin: 0 0 1em;
    }
    footer { margin-top: .75em; font-size: 14px; color: #777; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to My Website</h1>
    <p>
      This is a simple HTML page hosted for free using GitHub Pages and connected to
      my Porkbun domain. Replace this text with anything you like!
    </p>
    <img src="https://via.placeholder.com/1200x700.png?text=Your+Image+Here" alt="Placeholder Image"/>
    <footer>
      &copy; 2025 My Simple Website
    </footer>
  </main>
</body>
</html>
